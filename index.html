<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Claude 메모리 & 파일 입력</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --panel: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --accent: #d97757;
    --border: #d2d2d7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
  }
  h1 {
    font-size: 16px;
    margin: 0 0 4px;
  }
  p.sub {
    margin: 0 0 16px;
    font-size: 12px;
    color: var(--muted);
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 14px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  textarea {
    width: 100%;
    height: 260px;
    resize: vertical;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--text);
  }
  .file-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
  }
  #pickFilesBtn {
    background: var(--border);
    color: var(--text);
  }
  #saveBtn {
    background: var(--accent);
    color: white;
    width: 100%;
    padding: 12px;
    font-size: 14px;
    margin-top: 4px;
  }
  #fileList {
    list-style: none;
    margin: 10px 0 0;
    padding: 0;
    font-size: 12px;
    color: var(--muted);
  }
  #fileList li {
    padding: 3px 0;
  }
  #status {
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
    min-height: 16px;
  }
  #status.ok { color: #1a7f37; }
</style>
</head>
<body>
  <h1>Claude 메모리 &amp; 지침 / 파일 입력</h1>
  <p class="sub">아래 내용은 저장소의 CLAUDE.md로 저장되고, 선택한 파일은 uploads/ 폴더에 저장됩니다.</p>

  <div class="panel">
    <label for="content">메모리 / 지침 (CLAUDE.md)</label>
    <textarea id="content" placeholder="예: 이 프로젝트에서 지켜야 할 규칙, 컨텍스트, 메모 등을 입력하세요."></textarea>
  </div>

  <div class="panel">
    <label>첨부 파일</label>
    <div class="file-row">
      <button id="pickFilesBtn" type="button">파일 선택...</button>
      <span id="fileCount" style="font-size:12px;color:var(--muted);">선택된 파일 없음</span>
    </div>
    <ul id="fileList"></ul>
  </div>

  <button id="saveBtn" type="button">저장하기</button>
  <div id="status"></div>

  <script src="renderer.js"></script>
</body>
</html>
